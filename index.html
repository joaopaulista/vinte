<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VINTE — Finanças para nós</title>
    <meta name="description" content="Centralize suas contas, concilie transacoes e acompanhe seus KPIs financeiros." />
    <meta name="theme-color" content="#f8f6f2" />
    <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
    <script>
      // Aplica o tema antes da primeira pintura. Sem isso, o app renderiza claro
      // por um instante antes do React assumir — o famoso "flash" branco de quem
      // usa tema escuro.
      (function () {
        try {
          var stored = localStorage.getItem('vinte:theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#14273f');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
